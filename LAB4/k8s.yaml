---
# Subjects Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subjects-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subjects-service
  template:
    metadata:
      labels:
        app: subjects-service
    spec:
      containers:
      - name: subjects-service
        image: docker.io/lab4-subjects-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
---
# Subjects Service
apiVersion: v1
kind: Service
metadata:
  name: subjects-service
spec:
  selector:
    app: subjects-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: NodePort
---
